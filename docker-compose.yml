services:
  tt-scrap:
    build: .
    image: ghcr.io/karilaa-dev/tt-scrap:latest
    env_file:
      - .env
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    stop_grace_period: 60s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
