<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok video to Telegram</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; color: var(--foreground); font-family: var(--font-sans); }
  #tt-flow { width: 100%; --flow-color: var(--chart-1); }
  button, a { -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--ring); outline-offset: 3px; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 20px; }
  .context { color: var(--muted-foreground); }
  .controls { display: flex; gap: 8px; align-items: center; }
  .control { background: var(--secondary); color: var(--secondary-foreground); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 12px; }
  .control:disabled { opacity: .4; }
  .control.primary { background: var(--primary); color: var(--primary-foreground); border-color: transparent; }
  .counter { font-variant-numeric: tabular-nums; min-width: 54px; text-align: center; color: var(--muted-foreground); }
  .sequence-head, .step { display: grid; grid-template-columns: minmax(210px, 31%) minmax(0, 1fr); column-gap: 12px; }
  .sequence-head { margin-bottom: 6px; align-items: end; }
  .sequence-label { color: var(--muted-foreground); padding-left: 9px; }
  .actors { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); text-align: center; align-items: center; gap: 0; }
  .actor { padding: 6px 2px 12px; font-weight: 500; border-bottom: 1px solid var(--border); }
  .actor small { display: block; color: var(--muted-foreground); font-weight: 400; }
  .steps { display: grid; }
  .step { width: 100%; min-height: 47px; align-items: center; background: transparent; border: 0; border-radius: var(--radius); padding: 5px 0; text-align: left; }
  .step:hover { background: var(--accent-surface); }
  .step[aria-pressed="true"] { background: var(--accent-surface); color: var(--accent-surface-foreground); }
  .step-name { display: flex; align-items: center; gap: 9px; padding: 0 6px; min-width: 0; }
  .number { width: 25px; height: 25px; border-radius: 50%; display: grid; place-items: center; flex: 0 0 auto; color: var(--muted-foreground); background: var(--muted); font-variant-numeric: tabular-nums; }
  .step[aria-pressed="true"] .number { color: var(--primary-foreground); background: var(--primary); }
  .step-text { font-weight: 500; }
  .route { height: 36px; width: 100%; display: block; overflow: visible; color: var(--muted-foreground); }
  .step[aria-pressed="true"] .route { color: var(--flow-color); }
  .route .line { fill: none; stroke: currentColor; stroke-width: 1.5; }
  .route .dot { fill: currentColor; }
  .route .lifeline { stroke: var(--border); stroke-width: 1; }
  .route .packet { fill: currentColor; opacity: 0; }
  .step[aria-pressed="true"] .packet { opacity: 1; }
  .branch { display: inline-flex; align-items: center; gap: 8px; margin: 4px 0 10px 40px; color: var(--muted-foreground); }
  .branch button { border: 0; border-bottom: 1px dashed var(--border); background: transparent; padding: 4px 0; color: inherit; text-align: left; }
  .bypassed .step-name { opacity: .5; }
  .bypassed .step-text::after { content: ' · skipped'; font-weight: 400; }
  .detail { margin-top: 18px; border-top: 1px solid var(--border); padding-top: 16px; }
  .detail-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .detail-title { margin: 0; font: inherit; font-weight: 500; }
  .owner { color: var(--muted-foreground); }
  .detail p { margin: 8px 0 12px; }
  .payload { margin: 0 0 10px; padding: 12px 16px; color: var(--code-foreground); background: var(--code-background); border-radius: var(--radius); white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--font-mono); }
  .source-links { display: flex; flex-wrap: wrap; gap: 5px 14px; }
  .source-links a { color: var(--muted-foreground); text-decoration-color: var(--border); text-underline-offset: 3px; overflow-wrap: anywhere; }
  .source-links a:hover { color: var(--foreground); }
  .foot { display: flex; flex-wrap: wrap; gap: 5px 16px; color: var(--muted-foreground); margin-top: 18px; padding-bottom: 4px; }
  small, .small { font-size: .86em; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  @media (max-width: 550px) {
    .sequence-head { display: block; }
    .sequence-label { display: none; }
    .step { display: block; padding: 7px 0 3px; }
    .step-name { padding: 0 6px; }
    .route { height: 25px; margin-top: 3px; }
    .toolbar { margin-bottom: 12px; }
    .context { width: 100%; }
    .branch { margin-left: 40px; }
    .actor { padding-bottom: 8px; }
    .detail-head { display: block; }
    .owner { display: block; margin-top: 5px; }
  }
  @media (pointer: coarse) {
    .control, .branch button { min-height: 44px; }
  }
</style>
</head>
<body>
<main id="tt-flow" aria-label="Interactive sequence of a TikTok video delivery to Telegram">
  <div class="toolbar">
    <span class="context">TikTok → Telegram <span class="small">· one video</span></span>
    <div class="controls" aria-label="Walk through the delivery">
      <button type="button" class="control" id="previous" disabled>Previous</button>
      <span class="counter small" id="counter">1 / 10</span>
      <button type="button" class="control primary" id="next">Next →</button>
    </div>
  </div>
  <div class="sequence-head" aria-hidden="true">
    <span class="sequence-label small">Select a step</span>
    <div class="actors">
      <div class="actor">Client<small>URL + chat</small></div>
      <div class="actor">tt-scrap<small>Go service</small></div>
      <div class="actor">TikTok<small>API / CDN</small></div>
      <div class="actor">Telegram<small>Bot API</small></div>
    </div>
  </div>
  <div id="steps" class="steps" role="group" aria-label="Delivery stages"></div>
  <section class="detail" aria-labelledby="detail-title" aria-live="polite">
    <div class="detail-head">
      <h2 class="detail-title" id="detail-title"></h2>
      <span class="owner small" id="owner"></span>
    </div>
    <p id="description"></p>
    <pre class="payload small" id="payload"></pre>
    <div class="source-links small" id="sources"></div>
  </section>
  <div class="foot small">
    <span>Real code · 645b3e5</span>
    <span>Metadata is cached; video files are downloaded and uploaded each time.</span>
  </div>
</main>
<script>
(() => {
  const root = document.getElementById('tt-flow');
  const base = 'https://github.com/karilaa-dev/tt-scrap/blob/645b3e5e9b7719d1b7079be0e9e3fec96ecb8e22/';
  const stages = [
    {
      title: 'Receive the delivery request', owner: 'Client → tt-scrap', from: 0, to: 1,
      description: 'Your client calls the delivery endpoint with a TikTok URL and the destination chat. The service validates the JSON and bearer token, checks that a bot token is configured, then acquires a bounded delivery slot.',
      payload: 'POST /v1/tiktok/telegram-deliveries\nAuthorization: Bearer <API_KEY>\n{\n  "source": { "url": "https://www.tt.site/t/ZSboJ1v8D/" },\n  "telegram": { "chat_id": "<CHAT_ID>", "caption": "My video" }\n}',
      sources: [['internal/httpapi/api.go',306], ['internal/httpapi/telegram.go',139]]
    },
    {
      title: 'Resolve the share link', owner: 'tt-scrap ↔ TikTok', from: 1, to: 2, both: true,
      description: 'A direct /video/<id> URL already provides the post ID. A short link follows approved TikTok redirects; tt.site requests use www.tt.site. Resolution results are cached, so a valid cached link needs no new redirect request.',
      payload: 'www.tt.site/t/ZSboJ1v8D/ → TikTok post URL → post ID\nOnly approved HTTPS TikTok and tt.site hosts are accepted.',
      sources: [['internal/platform/resolve.go',64], ['internal/platform/resolve.go',35]]
    },
    {
      title: 'Check the metadata cache', owner: 'Inside tt-scrap', from: 1, to: 1,
      description: 'The service looks up the normalized extraction by post ID. A valid cache entry already contains the selected video and its asset context: jump to step 7. On a miss, fetch metadata and choose a rendition. Concurrent matching requests share extraction work.',
      payload: 'Cache hit → 7: download the saved video asset\nCache miss → 4: acquire a TikTok identity\nrefresh: true bypasses cached resolution and metadata.\nsource.extraction_id can reuse an existing extraction directly.',
      sources: [['internal/platform/tiktok.go',56], ['internal/platform/cache.go',1]]
    },
    {
      title: 'Lease a TikTok device identity', owner: 'tt-scrap · identity pool', from: 1, to: 1,
      description: 'The identity pool leases a prepared Android device session associated with a proxy. It reuses the device, cookies, and signing state. That lease serves the metadata request; its identity ID is recorded so media preparation can later reacquire the same identity.',
      payload: 'Prepared identity → device session + signing state + assigned proxy\nIdentity sessions are persisted in PostgreSQL.\nThe configured TikTok account cookie stays in memory.',
      sources: [['internal/identity/backend.go',55], ['internal/identity/lease.go',1]]
    },
    {
      title: 'Fetch signed app metadata', owner: 'tt-scrap ↔ TikTok app API', from: 1, to: 2, both: true,
      description: 'The Go client bootstraps signing state when needed and sends a signed Android app detail request. TikTok returns the available video addresses, dimensions, duration, and cover. Requests start anonymously; a configured account gets one retry for supported content restrictions.',
      payload: 'GET /aweme/v1/aweme/detail/?aweme_id=<POST_ID>\nResponse → video rendition URLs + metadata\nRecoverable identity failures and transient metadata errors have bounded retries.',
      sources: [['internal/tiktokapp/client.go',456], ['internal/identity/backend.go',68]]
    },
    {
      title: 'Choose the best video rendition', owner: 'Inside tt-scrap', from: 1, to: 1,
      description: 'Rank the available app streams by pixel count, then frame rate, then bitrate. Register the chosen URL and alternatives as a video asset, retaining its identity, request headers, and expected dimensions. This selection uses metadata without downloading quality probes.',
      payload: 'Highest width × height → highest FPS → highest bitrate\nAsset → MP4 URL + alternate URLs + identity ID + expected dimensions\nThe app video already includes audio.',
      sources: [['internal/platform/selection.go',55], ['internal/platform/normalize.go',56]]
    },
    {
      title: 'Download the MP4 to disk', owner: 'TikTok media → tt-scrap temporary file', from: 2, to: 1,
      description: 'Reacquire the selected asset’s identity, then take a download slot. Request the media through its app/CDN path and stream bytes to a temporary file with a reusable 128 KiB buffer and SHA-256 calculation. Failed transfers can try alternate URLs with exponential delay and jitter, within the deadline.',
      payload: 'TikTok media response → 128 KiB buffer → temporary .mp4\nEnforce the asset and Telegram byte limits while reading.\nPROXY_DATA_ONLY=true permits direct CDN transfers; app requests keep the proxy.',
      sources: [['internal/platform/download.go',31], ['internal/platform/download.go',145]]
    },
    {
      title: 'Validate and prepare the upload', owner: 'Inside tt-scrap · disk + optional cover', from: 1, to: 1,
      description: 'Reject empty, truncated, invalid, or unexpected-dimension MP4 files. A cover can download alongside the video and become a JPEG thumbnail; failure of this optional thumbnail does not block delivery. Preparation finishes and checkpoints/releases the identity before any Telegram upload begins.',
      payload: 'MP4 validation → prepared video file\nOptional cover → JPEG thumbnail + video cover\nNo video transcoding or separate audio merge in this path.',
      sources: [['internal/platform/download.go',200], ['internal/httpapi/telegram.go',273], ['internal/identity/media_batch.go',15]]
    },
    {
      title: 'Upload with Telegram sendVideo', owner: 'tt-scrap → Telegram Bot API', from: 1, to: 3,
      description: 'Acquire an upload slot and stream a multipart request directly from the prepared file. Include the destination chat, caption, video dimensions, duration, and supports_streaming=true unless overridden. The configured bot token authorizes sendVideo; delivery=document uses sendDocument instead.',
      payload: 'POST <Telegram Bot API>/bot<TOKEN>/sendVideo\nvideo = attach://video_file\nvideo_file = MP4 bytes streamed from disk\nthumbnail / cover = optional JPEG',
      sources: [['internal/httpapi/telegram.go',422], ['internal/httpapi/telegram_client.go',59], ['internal/httpapi/telegram_client.go',149]]
    },
    {
      title: 'Return the result and clean up', owner: 'Telegram → tt-scrap → client', from: 3, to: 0, via: 1,
      description: 'On success, Telegram creates the video message in the requested chat. For one video, tt-scrap forwards Telegram’s HTTP status, content type, and response body to the caller. It records the outcome, removes temporary video/thumbnail files, and releases capacity on completion or failure.',
      payload: 'Success: { "ok": true, "result": { …Telegram Message… } }\nInspect ok as well as HTTP status to confirm delivery.\nAn ambiguous Telegram network failure is not automatically retried.',
      sources: [['internal/httpapi/telegram_client.go',215], ['internal/httpapi/telegram.go',377], ['internal/httpapi/delivery_event.go',1]]
    }
  ];
  const list = root.querySelector('#steps');
  let selected = 0;
  let cacheHit = false;
  let rowButtons = [];
  let packetAnimation;
  const ns = 'http://www.w3.org/2000/svg';

  function svgElement(name, attrs) {
    const node = document.createElementNS(ns, name);
    for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
    return node;
  }
  stages.forEach((stage, index) => {
    const row = document.createElement('button');
    row.type = 'button';
    row.className = 'step';
    row.dataset.step = index + 1;
    row.setAttribute('aria-pressed', String(index === 0));
    row.setAttribute('aria-label', `Step ${index + 1}: ${stage.title}. ${stage.owner}`);
    const name = document.createElement('span');
    name.className = 'step-name';
    const number = document.createElement('span');
    number.className = 'number small';
    number.textContent = index + 1;
    const title = document.createElement('span');
    title.className = 'step-text';
    title.textContent = stage.title;
    name.append(number, title);
    row.append(name);
    const route = svgElement('svg', {class:'route', 'aria-hidden':'true', preserveAspectRatio:'none'});
    row.append(route);
    row.addEventListener('click', () => select(index, true));
    rowButtons.push(row);
    list.append(row);
    if (index === 2) {
      const branch = document.createElement('div');
      branch.className = 'branch small';
      const arrow = document.createElement('span');
      arrow.textContent = '↳';
      arrow.setAttribute('aria-hidden', 'true');
      const button = document.createElement('button');
      button.type = 'button';
      button.id = 'cache-branch';
      button.textContent = 'Cache hit → skip to download (7)';
      button.addEventListener('click', () => { cacheHit = true; select(6, true); });
      branch.append(arrow, button);
      list.append(branch);
    }
  });

  function drawRoute(index) {
    const stage = stages[index];
    const svg = rowButtons[index].querySelector('.route');
    const width = Math.max(1, svg.getBoundingClientRect().width);
    const height = Math.max(1, svg.getBoundingClientRect().height);
    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
    svg.replaceChildren();
    const xs = [0,1,2,3].map(i => width * (i + .5) / 4);
    const y = height / 2;
    const halfHead = 3.5;
    xs.forEach(x => svg.append(svgElement('line', {class:'lifeline', x1:x, x2:x, y1:0, y2:height})));
    const from = xs[stage.from], to = xs[stage.to];
    let path;
    if (stage.from === stage.to) {
      const reach = Math.min(26, width / 9);
      path = `M ${from} ${y-7} H ${from+reach} V ${y+7} H ${from}`;
      svg.append(svgElement('path', {class:'line', d:path}));
      svg.append(svgElement('path', {class:'line', d:`M ${from+5} ${y+7-halfHead} L ${from} ${y+7} L ${from+5} ${y+7+halfHead}`}));
    } else {
      path = `M ${from} ${y} L ${to} ${y}`;
      svg.append(svgElement('path', {class:'line', d:path}));
      const direction = to > from ? 1 : -1;
      svg.append(svgElement('path', {class:'line', d:`M ${to-direction*6} ${y-halfHead} L ${to} ${y} L ${to-direction*6} ${y+halfHead}`}));
      if (stage.both) {
        svg.append(svgElement('path', {class:'line', d:`M ${from+direction*6} ${y-halfHead} L ${from} ${y} L ${from+direction*6} ${y+halfHead}`}));
      }
    }
    svg.append(svgElement('circle', {class:'dot', cx:from, cy:stage.from === stage.to ? y-7 : y, r:2.5}));
    if (stage.via !== undefined) svg.append(svgElement('circle', {class:'dot', cx:xs[stage.via], cy:y, r:3}));
    const packet = svgElement('circle', {class:'packet', cx:from, cy:stage.from === stage.to ? y-7 : y, r:4});
    packet.style.offsetPath = `path('${path}')`;
    packet.style.offsetDistance = '100%';
    packet.setAttribute('cx', 0);
    packet.setAttribute('cy', 0);
    svg.append(packet);
  }

  function select(index, animate = false) {
    selected = Math.min(stages.length - 1, Math.max(0, index));
    if (selected >= 3 && selected <= 5) cacheHit = false;
    const stage = stages[selected];
    rowButtons.forEach((button, i) => {
      button.setAttribute('aria-pressed', String(i === selected));
      button.classList.toggle('bypassed', cacheHit && i >= 3 && i <= 5);
    });
    root.querySelector('#counter').textContent = `${selected + 1} / ${stages.length}`;
    root.querySelector('#previous').disabled = selected === 0;
    root.querySelector('#next').disabled = selected === stages.length - 1;
    root.querySelector('#detail-title').textContent = `${selected + 1}. ${stage.title}`;
    root.querySelector('#owner').textContent = stage.owner;
    root.querySelector('#description').textContent = stage.description;
    root.querySelector('#payload').textContent = stage.payload;
    const sources = root.querySelector('#sources');
    sources.replaceChildren();
    stage.sources.forEach(([path,line]) => {
      const link = document.createElement('a');
      link.href = `${base}${path}#L${line}`;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = `${path.split('/').pop()}:${line}`;
      link.setAttribute('aria-label', `View ${path} at line ${line}`);
      sources.append(link);
    });
    if (packetAnimation) packetAnimation.cancel();
    if (animate && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      const packet = rowButtons[selected].querySelector('.packet');
      packetAnimation = packet.animate([{offsetDistance:'0%'},{offsetDistance:'100%'}], {duration:550, easing:'ease-in-out', fill:'forwards'});
    }
  }
  root.querySelector('#previous').addEventListener('click', () => select(cacheHit && selected === 6 ? 2 : selected - 1, true));
  root.querySelector('#next').addEventListener('click', () => select(cacheHit && selected === 2 ? 6 : selected + 1, true));
  const redraw = () => rowButtons.forEach((_, index) => drawRoute(index));
  redraw();
  select(0);
  new ResizeObserver(redraw).observe(root);

  window.flowSelfCheck = () => {
    const problems = [];
    const saved = selected;
    const savedCache = cacheHit;
    rowButtons.forEach((button, index) => {
      button.click();
      if (!root.querySelector('#detail-title').textContent.startsWith(`${index + 1}.`)) problems.push(`Selection failed at ${index + 1}`);
      if (root.querySelectorAll('.step[aria-pressed="true"]').length !== 1) problems.push('Selection is not unique');
    });
    root.querySelector('#previous').click();
    if (selected !== 8) problems.push('Previous failed');
    root.querySelector('#next').click();
    if (selected !== 9 || !root.querySelector('#next').disabled) problems.push('Next boundary failed');
    root.querySelector('#cache-branch').click();
    if (selected !== 6 || root.querySelectorAll('.bypassed').length !== 3) problems.push('Cache hit failed');
    root.querySelector('#previous').click();
    if (selected !== 2) problems.push('Cache previous failed');
    root.querySelector('#next').click();
    if (selected !== 6) problems.push('Cache next failed');
    cacheHit = savedCache;
    select(saved);
    if (document.documentElement.scrollWidth > innerWidth + 1) problems.push('Horizontal overflow');
    if (rowButtons.some(button => !button.querySelector('svg path'))) problems.push('Missing route');
    return {passed:problems.length === 0, checks:'10 selections, controls, cache branch, route drawing, responsive overflow', width:innerWidth, problems};
  };
})();
</script>
</body>
</html>
