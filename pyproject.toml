[project]
name = "tt-scrap"
version = "0.1.0"
description = "Authenticated TikTok/Instagram extraction and Telegram delivery API"
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = "==3.13.*"
dependencies = [
    # yt-dlp 2026.7.4 rejects curl-cffi 0.16; keep the newest supported 0.15.x.
    "aiohttp==3.14.3",
    "curl-cffi>=0.15.0,<0.16.0",
    "fastapi>=0.141.1,<0.142.0",
    "httpx>=0.28.1,<0.29.0",
    "Pillow==12.1.0",
    "pillow-heif==1.1.1",
    "pydantic-settings>=2.13.1,<3.0.0",
    "uvicorn[standard]>=0.52.1,<0.53.0",
    "yt-dlp==2026.7.4",
]

[dependency-groups]
dev = [
    "mypy>=2.3,<3.0",
    "pytest>=8.4,<10.0",
    "pytest-asyncio>=1.2,<2.0",
    "pytest-cov>=7.0,<8.0",
    "respx>=0.23.1,<0.24",
    "ruff>=0.16.1,<0.17",
]

[project.scripts]
tt-scrap = "tt_scrap.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tt_scrap"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: calls live TikTok, Instagram, or RapidAPI endpoints"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["tt_scrap"]

[[tool.mypy.overrides]]
module = ["pillow_heif", "pillow_heif.*", "yt_dlp", "yt_dlp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tt_scrap.media.downloader"]
disallow_untyped_calls = false
