[project]
name = "tt-scrap"
version = "0.1.0"
description = "Authenticated TikTok and Instagram extraction REST API"
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = "==3.13.*"
dependencies = [
    "cryptography>=46.0,<48.0",
    "curl-cffi==0.13.0",
    "fastapi>=0.135.1,<0.136.0",
    "httpx>=0.28.1,<0.29.0",
    "pydantic-settings>=2.13.1,<3.0.0",
    "redis>=6.4,<8.0",
    "uvicorn[standard]>=0.41.0,<0.42.0",
    "yt-dlp==2026.4.10.235301.dev0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.31,<3.0",
    "mypy>=1.18,<2.0",
    "pytest>=8.4,<10.0",
    "pytest-asyncio>=1.2,<2.0",
    "pytest-cov>=7.0,<8.0",
    "respx>=0.22,<0.23",
    "ruff>=0.14,<0.16",
]

[project.scripts]
tt-scrap = "tt_scrap.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tt_scrap"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a real Redis instance",
    "live: calls live TikTok, Instagram, or RapidAPI endpoints",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["tt_scrap"]

[[tool.mypy.overrides]]
module = ["yt_dlp", "yt_dlp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tt_scrap.media.downloader"]
disallow_untyped_calls = false
